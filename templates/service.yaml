apiVersion: v1
kind: Service
metadata:
  name: {{ include "bt-otel-collector-helm.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bt-otel-collector-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: health-check
      port: 13133
      targetPort: health-check
  selector:
    {{- include "bt-otel-collector-helm.selectorLabels" . | nindent 4 }}
