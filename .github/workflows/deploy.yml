name: OTel Collector — Helm Deploy

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!.github/workflows/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: otel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint OTel chart
        run: helm lint .

  deploy:
    name: Deploy OTel
    runs-on: ubuntu-latest
    needs: lint
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy info
        run: |
          echo "## 🚀 OTel Collector Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Setup SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Read namespace
        id: vars
        run: |
          NAMESPACE=$(helm show values . | grep '^namespace:' | awk '{print $2}')
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Upload chart to server
        run: |
          scp -o StrictHostKeyChecking=no -r . \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/bt-otel-collector-helm"

      - name: Ensure namespace exists
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "microk8s kubectl get namespace ${{ steps.vars.outputs.namespace }} 2>/dev/null \
             || microk8s kubectl create namespace ${{ steps.vars.outputs.namespace }}"

      - name: Helm upgrade/install via microk8s helm3
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
              microk8s helm3 upgrade --install bt-otel-collector-helm /tmp/bt-otel-collector-helm \
                --namespace ${{ steps.vars.outputs.namespace }} \
                --atomic \
                --timeout 300s \
                --cleanup-on-fail
            "

      - name: Rollout status
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
              NAMESPACE=${{ steps.vars.outputs.namespace }}
              microk8s kubectl rollout status deployment/bt-otel-collector-helm -n \$NAMESPACE --timeout=300s
            "

      - name: Cleanup chart from server
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "rm -rf /tmp/bt-otel-collector-helm" || true

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh
